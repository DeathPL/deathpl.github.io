<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cortex</title>
  <style>
    body {
      background-color: #ffffff; /* white background */
      color: #111111; /* dark text */
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      margin: 0;
      padding: 2rem;
    }
    p {
      margin-top: 1rem;
      text-align: center;
      max-width: 600px;
      align-self: center;
    }
    .spacer {
      flex-grow: 1; /* pushes the bottom image down */
    }
    img.handdrawn {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }
    img.top-image {
      max-width: 300px; /* optional, keeps it a reasonable size */
      margin-bottom: 2rem;
    }
  </style>
</head>
<body>
  <img src="images/handdrawn/hi.png" alt="Hand-drawn Hi" class="handdrawn top-image">

  <p>Welcome to <strong>Cortex</strong> - a space where I dump random thoughts in my head.</p>
  <p>All content © DeathPL. Please ask for permission before using anything elsewhere.</p>
  <p>Contact me on Discord (deathpl1) if you want to suggest changes or additions.</p>

  <div class="spacer"></div>

  <img src="images/handdrawn/bottom.png" alt="Hand-drawn decoration" class="handdrawn">
</body>
</html>
