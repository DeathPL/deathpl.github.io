<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cortex</title>
  <style>
    body {
      background-color: #ffffff; /* white background */
      color: #111111; /* dark text */
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      margin: 0;
      padding: 2rem;
    }
    p {
      margin-top: 1rem;
      text-align: center;
      max-width: 600px;
      align-self: center;
    }
    .spacer {
      flex-grow: 1; /* pushes content before footer up */
    }
    img.handdrawn {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }
    img.top-image {
      max-width: 300px; /* keeps hi.png reasonable size */
      margin-bottom: 2rem;
    }
    img.cortex-text {
      width: 256px; /* your image size */
      height: 128px;
      vertical-align: middle;
    }
    footer {
      text-align: center;
      font-size: 0.9rem;
      margin-top: 2rem;
      color: #555555;
    }
  </style>
</head>
<body>
  <img src="images/handdrawn/hi.png" alt="Hand-drawn Hi" class="handdrawn top-image">

  <p>
    Welcome to <img src="images/handdrawn/cortex text.png" alt="Cortex text" class="cortex-text"> - a space where I dump random thoughts in my head.
  </p>

  <div class="spacer"></div>

  <img src="images/handdrawn/bottom.png" alt="Hand-drawn decoration" class="handdrawn">

  <footer>
    All content © DeathPL. Please ask for permission before using anything elsewhere.<br>
    Contact me on Discord (deathpl1) if you want to suggest changes or additions.
  </footer>
</body>
</html>
