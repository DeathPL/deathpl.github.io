<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cortex with Sidebar</title>
  <style>
    body {
      margin: 0;
      font-family: 'Courier New', monospace;
      background-color: #ffffff;
      display: flex;
    }

    /* Sidebar */
    #sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 200px;           /* sidebar width */
      height: 100vh;
      background-color: #111111;
      color: #ffffff;
      padding: 1rem;
      box-sizing: border-box;
      transition: transform 0.3s ease;
      z-index: 1000;
    }

    /* Collapsed state moves it completely left */
    #sidebar.collapsed {
      transform: translateX(-100%);
    }

    /* Arrow toggle */
    #toggle-btn {
      position: fixed;
      left: 200px;            /* next to sidebar */
      top: 50%;
      transform: translateY(-50%);
      background-color: #111111;
      color: #ffffff;
      border: none;
      padding: 0.5rem 1rem;
      cursor: pointer;
      transition: left 0.3s ease;
      z-index: 1001;
    }

    /* When collapsed, move arrow to screen edge */
    #toggle-btn.collapsed {
      left: 0;
    }

    /* Main content area */
    #content {
      margin-left: 200px;
      padding: 2rem;
      transition: margin-left 0.3s ease;
      flex: 1;
    }

    /* Adjust content when sidebar collapsed */
    #sidebar.collapsed + #toggle-btn + #content {
      margin-left: 0;
    }

    /* Example text inside sidebar */
    #sidebar p {
      margin: 0.5rem 0;
    }
  </style>
</head>
<body>

  <div id="sidebar">
    <p>Menu Item 1</p>
    <p>Menu Item 2</p>
    <p>Menu Item 3</p>
  </div>

  <button id="toggle-btn">&lt;</button>

  <div id="content">
    <h1>Welcome to Cortex</h1>
    <p>This is your main content area.</p>
  </div>

  <script>
    const sidebar = document.getElementById('sidebar');
    const toggleBtn = document.getElementById('toggle-btn');

    toggleBtn.addEventListener('click', () => {
      sidebar.classList.toggle('collapsed');
      toggleBtn.classList.toggle('collapsed');

      // Change the arrow symbol
      if (sidebar.classList.contains('collapsed')) {
        toggleBtn.innerHTML = '&gt;';
      } else {
        toggleBtn.innerHTML = '&lt;';
      }
    });
  </script>
</body>
</html>
